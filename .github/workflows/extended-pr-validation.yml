name: Extended PR validation

on:
  pull_request_target:
    branches: [main, 'rel-*']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to validate
        required: true
        default: refs/heads/main
      source_commit:
        description: Expected commit for the ref
        required: false

concurrency:
  group: extended-pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ADO_ORGANIZATION: ${{ secrets.ADO_PR_ORGANIZATION }}
      ADO_PROJECT: ${{ secrets.ADO_PR_PROJECT }}
      ADO_PIPELINE_ID: ${{ secrets.ADO_PR_PIPELINE_ID }}
      ADO_PR_OBJECT_ID: ${{ secrets.ADO_PR_OBJECT_ID }}

    steps:
      - name: Sign in for private validation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ADO_PR_CLIENT_ID }}
          tenant-id: ${{ secrets.ADO_PR_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Select pull request revision
        id: revision
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$MERGE_COMMIT" ]]; then
            echo "GitHub did not create a merge commit for this pull request." >&2
            exit 1
          fi
          echo "source_ref=refs/pull/${PR_NUMBER}/merge" >> "$GITHUB_OUTPUT"
          echo "source_commit=${MERGE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Select manual revision
        id: manual_revision
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Dispatch and monitor private validation
        shell: bash
        env:
          PR_SOURCE_REF: ${{ steps.revision.outputs.source_ref || steps.manual_revision.outputs.source_ref }}
          PR_SOURCE_COMMIT: ${{ steps.revision.outputs.source_commit || steps.manual_revision.outputs.source_commit }}
        run: |
          set -euo pipefail

          for variable in ADO_ORGANIZATION ADO_PROJECT ADO_PIPELINE_ID ADO_PR_OBJECT_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required dispatcher configuration is unavailable." >&2
              exit 1
            fi
          done

          ado_token="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            --output tsv)"
          echo "::add-mask::${ado_token}"

          token_payload="${ado_token#*.}"
          token_payload="${token_payload%%.*}"
          case $((${#token_payload} % 4)) in
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
          esac
          token_object_id="$(printf '%s' "$token_payload" | tr '_-' '/+' | base64 --decode 2>/dev/null | jq -er '.oid')"
          if [[ "$token_object_id" != "$ADO_PR_OBJECT_ID" ]]; then
            echo "Azure DevOps token identity does not match the configured dispatcher." >&2
            exit 1
          fi

          organization="${ADO_ORGANIZATION%/}"
          project="$(jq -rn --arg value "$ADO_PROJECT" '$value | @uri')"
          build_api="${organization}/${project}/_apis/build/builds"
          run_id=""

          report_http_error() {
            local description="$1"
            local status_code="$2"
            local error_type
            error_type="$(jq -r '.typeKey // "UnclassifiedResponse"' response.json 2>/dev/null || true)"
            if [[ ! "$error_type" =~ ^[A-Za-z0-9_.]+$ ]]; then
              error_type="UnclassifiedResponse"
            fi
            echo "${description} (HTTP ${status_code}, type ${error_type})." >&2
          }

          cancel_build() {
            if [[ -n "$run_id" ]]; then
              curl --silent --output /dev/null \
                --header "Authorization: Bearer ${ado_token}" \
                --request PATCH \
                --header 'Content-Type: application/json' \
                --data '{"status":"cancelling"}' \
                "${build_api}/${run_id}?api-version=7.1" || true
            fi
          }
          trap cancel_build INT TERM

          payload="$(jq -n \
            --arg pipeline_id "$ADO_PIPELINE_ID" \
            --arg source_ref "$PR_SOURCE_REF" \
            --arg source_commit "$PR_SOURCE_COMMIT" \
            '{
              definition: {id: ($pipeline_id | tonumber)},
              sourceBranch: "refs/heads/main",
              templateParameters: {
                sourceRef: $source_ref,
                sourceCommit: $source_commit
              }
            }')"

          status_code="$(curl --silent --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${ado_token}" \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${build_api}?api-version=7.1")"

          if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
            report_http_error "Azure DevOps rejected the validation request" "$status_code"
            exit 1
          fi

          run_id="$(jq -er '.id' response.json)"
          rm response.json
          echo "Private validation was queued."

          while true; do
            status_code="$(curl --silent --output response.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${ado_token}" \
              "${build_api}/${run_id}?api-version=7.1")"

            if [[ "$status_code" -lt 200 || "$status_code" -ge 300 ]]; then
              report_http_error "Unable to read validation status" "$status_code"
              exit 1
            fi

            state="$(jq -er '.status' response.json)"
            if [[ "$state" == "completed" ]]; then
              result="$(jq -er '.result' response.json)"
              rm response.json
              echo "Private validation completed with result: ${result}."
              [[ "$result" == "succeeded" ]]
              exit
            fi

            rm response.json
            sleep 30
          done